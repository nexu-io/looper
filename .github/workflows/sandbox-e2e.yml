name: sandbox-e2e

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-sandbox-e2e:
    name: GitHub sandbox E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOOPER_E2E_GITHUB: "1"
      LOOPER_E2E_SANDBOX_REPO: ${{ vars.LOOPER_E2E_SANDBOX_REPO != '' && vars.LOOPER_E2E_SANDBOX_REPO || 'nexu-io/looper-sandbox' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve sandbox repository target
        id: sandbox-repo
        shell: bash
        run: |
          repo="${LOOPER_E2E_SANDBOX_REPO}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          if [ -z "$owner" ] || [ -z "$name" ] || [ "$owner" = "$repo" ]; then
            printf 'LOOPER_E2E_SANDBOX_REPO must use owner/repo format, got %s\n' "$repo" >&2
            exit 1
          fi
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'repo=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: Mint sandbox GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOOPER_E2E_GITHUB_APP_ID }}
          private-key: ${{ secrets.LOOPER_E2E_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.sandbox-repo.outputs.owner }}
          repositories: |
            ${{ steps.sandbox-repo.outputs.repo }}

      - name: Run GitHub sandbox E2E
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/github-sandbox-e2e
          LOOPER_E2E_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: go test ./internal/e2e -run '^TestGitHubSandbox' -skip '^TestGitHubSandboxAppIdentity$' -count=1

      - name: Prepare daemon App credential reference
        env:
          SANDBOX_APP_PRIVATE_KEY: ${{ secrets.LOOPER_E2E_GITHUB_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          umask 077
          app_key_dir="$(mktemp -d "${RUNNER_TEMP}/looper-app-key.XXXXXX")"
          export SANDBOX_APP_KEY_FILE="${app_key_dir}/private.pem"
          printf 'LOOPER_E2E_GITHUB_APP_PRIVATE_KEY_FILE=%s\n' "$SANDBOX_APP_KEY_FILE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ["SANDBOX_APP_PRIVATE_KEY"].replace("\\n", "\n")
          if not key.strip():
              raise SystemExit("sandbox App private key is missing")
          Path(os.environ["SANDBOX_APP_KEY_FILE"]).write_text(key)
          PY

      - name: Verify daemon-owned GitHub App identity
        env:
          LOOPER_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/looper-e2e/github-app-identity
          LOOPER_E2E_GITHUB_APP: "1"
          LOOPER_E2E_GITHUB_APP_ID: ${{ vars.LOOPER_E2E_GITHUB_APP_ID }}
          LOOPER_E2E_GITHUB_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: go test ./internal/e2e -run '^TestGitHubSandboxAppIdentity$' -count=1

      - name: Remove daemon App private key
        if: always()
        shell: bash
        run: |
          if [ -n "${LOOPER_E2E_GITHUB_APP_PRIVATE_KEY_FILE:-}" ]; then
            rm -f -- "$LOOPER_E2E_GITHUB_APP_PRIVATE_KEY_FILE"
            rmdir -- "$(dirname -- "$LOOPER_E2E_GITHUB_APP_PRIVATE_KEY_FILE")"
          fi

      - name: Upload sandbox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: github-sandbox-e2e-artifacts
          path: |
            ${{ runner.temp }}/looper-e2e/github-sandbox-e2e
            ${{ runner.temp }}/looper-e2e/github-app-identity
          if-no-files-found: ignore
