name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        env:
          LOOPER_BUILD_GIT_SHA: ${{ github.sha }}
        run: |
          export LOOPER_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "$(go run ./tools/go-build-flags)" ./...

  resolve-comments-e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect resolve-comments changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            resolve_comments:
              - 'internal/fixer/**'
              - 'internal/reviewer/**'

      - name: Set up Go
        if: steps.changes.outputs.resolve_comments == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run resolve-comments E2E
        if: steps.changes.outputs.resolve_comments == 'true'
        run: go test ./internal/e2e -run 'TestScenarioResolveComments' -count=1

  worktree-invariants-e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect worktree-sensitive changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            worktree_invariants:
              - 'internal/worker/**'
              - 'internal/fixer/**'
              - 'internal/reviewer/**'
              - 'internal/api/**'
              - 'internal/worktree*/**'

      - name: Set up Go
        if: steps.changes.outputs.worktree_invariants == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run worktree invariants E2E
        if: steps.changes.outputs.worktree_invariants == 'true'
        run: go test ./internal/e2e -run 'TestInvariantWorker' -count=1
